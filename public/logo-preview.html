<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Rindo - Logo Concepts v2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 40px 20px; }

  h1 { font-size: 24px; font-weight: 600; text-align: center; margin-bottom: 50px; }

  .concepts { display: flex; flex-direction: column; align-items: center; gap: 60px; }

  .concept h2 { font-size: 16px; font-weight: 500; text-align: center; margin-bottom: 16px; }

  .previews { display: flex; gap: 20px; justify-content: center; }

  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }

  .box {
    width: 160px;
    height: 160px;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #e0e0e0;
  }

  .box.l { background: #fff; color: #111; }
  .box.d { background: #0a0a0a; color: #f5f5f5; }

  .label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
</style>
</head>
<body>

<h1>Rindo — Logo Concepts v2</h1>

<div class="concepts">

  <!-- 2: Rombo con curvatura -->
  <div class="concept">
    <h2>2. Rombo Orgánico (con curvas)</h2>
    <div class="previews">
      <div class="col">
        <div class="box l">
          <svg viewBox="0 0 100 100" width="80" height="80" style="color:#111">
            <path d="M50,6 Q90,42 50,94 Q10,42 50,6 Z" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linejoin="round" transform="rotate(-8, 50, 50)"/>
          </svg>
        </div>
        <span class="label">Light</span>
      </div>
      <div class="col">
        <div class="box d">
          <svg viewBox="0 0 100 100" width="80" height="80" style="color:#f5f5f5">
            <path d="M50,6 Q90,42 50,94 Q10,42 50,6 Z" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linejoin="round" transform="rotate(-8, 50, 50)"/>
          </svg>
        </div>
        <span class="label">Dark</span>
      </div>
    </div>
  </div>

  <!-- 3: Bloques cruzados más asimétricos, sin punto rojo -->
  <div class="concept">
    <h2>3. Bloques Cruzados (asimétrico, sin dot)</h2>
    <div class="previews">
      <div class="col">
        <div class="box l">
          <svg viewBox="0 0 100 100" width="80" height="80" style="color:#111">
            <rect x="12" y="40" width="68" height="14" rx="3" fill="currentColor" transform="rotate(-32, 50, 50)"/>
            <rect x="24" y="40" width="58" height="14" rx="3" fill="currentColor" transform="rotate(38, 50, 50)" opacity="0.55"/>
          </svg>
        </div>
        <span class="label">Light</span>
      </div>
      <div class="col">
        <div class="box d">
          <svg viewBox="0 0 100 100" width="80" height="80" style="color:#f5f5f5">
            <rect x="12" y="40" width="68" height="14" rx="3" fill="currentColor" transform="rotate(-32, 50, 50)"/>
            <rect x="24" y="40" width="58" height="14" rx="3" fill="currentColor" transform="rotate(38, 50, 50)" opacity="0.55"/>
          </svg>
        </div>
        <span class="label">Dark</span>
      </div>
    </div>
  </div>

</div>

</body>
</html>
