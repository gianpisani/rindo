name: Prepare Jev production
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prepare-jev-production
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure server secret and category context
        run: node scripts/prepare-jev-production.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          RINDO_CATEGORY_OWNER_EMAIL: ${{ secrets.RINDO_CATEGORY_OWNER_EMAIL }}
