name: Revisar PR
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: escala, tipos, lint, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Escala de diseño
        run: npm run lint:design
      - name: Tipos (tsc)
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Lint (eslint)
        run: npx eslint src
      - name: Tests
        run: npm test
      # Las VITE_SUPABASE_* públicas vienen del .env versionado (las mismas que usa Vercel).
      - name: Build
        run: npm run build
